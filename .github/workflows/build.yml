name: Build TOHE Role DLL

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup .NET 6.0
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Build C# File
      run: |
        mkdir output
        dotnet new classlib -n XrayRole -o .
        dotnet build -c Release -o ./output

    - name: Upload Finished DLL
      uses: actions/upload-artifact@v3
      with:
        name: TOHE-Xray-DLL
        path: ./output/*.dll
